<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3Täler Karte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3Täler">
<meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Karte füllt den ganzen Bildschirm -->
<div id="map"></div>

<!-- Filter oben -->
<div id="topbar">
  <div id="chips">
    <button class="chip" data-filter="near">≤ 1 h Fahrt</button>
    <button class="chip" data-filter="snow">Neuschnee</button>
    <button class="chip" data-filter="fav">★ Favoriten</button>
    <button class="chip" data-filter="big">Groß (≥ 25 km)</button>
    <button class="chip" data-filter="sunT">☀ Gute Sicht heute</button>
    <button class="chip" data-filter="sunM">☀ Gute Sicht morgen</button>
  </div>
</div>

<!-- Runde Buttons rechts -->
<div id="fabs">
  <button class="fab" id="btnLocate" aria-label="Mein Standort">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
  </button>
  <button class="fab" id="btnDice" aria-label="Skigebiet auslosen">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/><circle cx="15.5" cy="8.5" r="1.3" class="dot"/><circle cx="8.5" cy="15.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/></svg>
  </button>
  <button class="fab" id="btnWallet" aria-label="Pass-Bilanz">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2.5"/><path d="M5 6l9-3 1.5 3"/></svg>
  </button>
</div>

<!-- Ausziehbare Liste / Detailansicht -->
<section id="sheet" data-state="peek">
  <div id="sheetHead">
    <div class="grip"></div>
  </div>
  <div id="sheetBody">
    <div id="listView">
      <div class="listTop">
        <div>
          <div class="h2" id="listTitle">Skigebiete</div>
          <div class="muted small" id="snowInfo">Schneedaten werden geladen …</div>
        </div>
        <div class="seg" role="tablist">
          <button data-sort="time" class="on">Fahrtzeit</button>
          <button data-sort="snow">Neuschnee</button>
          <button data-sort="wx">Wetter</button>
        </div>
      </div>
      <div id="podium" hidden></div>
      <ul id="list"></ul>
    </div>
    <div id="detailView" hidden></div>
  </div>
</section>

<!-- Dialoge (Bilanz, Auslosen, Check-in) -->
<div id="modalWrap" hidden>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
